version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/Stockholm
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:35"
      timezone: Europe/Stockholm
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "chore(deps)"
