version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/Stockholm
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Stockholm
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      container-images:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:35"
      timezone: Europe/Stockholm
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "chore(deps)"
