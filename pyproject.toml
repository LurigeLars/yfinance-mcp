[project]
name = "yfinance-mcp"
version = "0.4.0"
description = "Read-only MCP server for Yahoo Finance options data via yfinance"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastmcp==4.0.10",
    "pandas>=3.0.6,<4",
    "yfinance>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.9,<1",
]

[project.scripts]
yfinance-mcp = "yfinance_mcp:main"
yfinance-mcp-http = "yfinance_mcp.http:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yfinance_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
